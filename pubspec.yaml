name: task_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # API
  dio: ^5.11.0
  pretty_dio_logger: ^1.4.0

  # Riverpod
  flutter_riverpod: 3.3.1
  riverpod_annotation: 4.0.2

  # Routing
  go_router: ^17.5.0

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0

  # Files / Images
  image_picker: ^1.2.3
  shimmer: ^3.0.0
  url_launcher: ^6.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.10.0
  riverpod_generator: 4.0.3

  # JSON generation
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true